<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h2>Login</h2>

<form id="loginForm">
  <input type="text" id="userid" placeholder="Email or Phone" required><br>
  <input type="password" id="password" placeholder="Password" required><br>
  <div class="remember-row">
    <input type="checkbox" id="remember">
    <label for="remember">Remember me</label>
  </div>
  <button type="submit">Login</button><br>
  <a href="#" id="forgot">Forgot Password?</a>
</form>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const userid = document.getElementById("userid").value;
  const password = document.getElementById("password").value;
  const remember = document.getElementById("remember").checked;

  const response = await fetch("http://localhost:5000/login", {
    method:"POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userid, password, remember })
  });

  const data = await response.text();
  alert(data);
});

// forgot password
document.getElementById("forgot").addEventListener("click", async function(){
  const userid = prompt("Enter your Email or Phone to reset password:");
  const method = prompt("Receive code via 'email' or 'phone'?");

  const codeResponse = await fetch("http://localhost:5000/forgot", {
    method:"POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userid, method })
  });

  const codeSent = await codeResponse.text();
  alert(codeSent);

  const userCode = prompt("Enter the code you received:");

  const password = prompt("Enter new password:");
  const confirmPassword = prompt("Re-type new password:");

  if(password !== confirmPassword){
    alert("Passwords do not match!");
    return;
  }

  const resetResp = await fetch("http://localhost:5000/reset", {
    method:"POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ userid, code:userCode, newPassword: password })
  });

  alert(await resetResp.text());
});
</script>

</body>
</html>
